name: Build Native Player Diagnostic V2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-native-player-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate known-good local H.264 MP4
        run: |
          mkdir -p app/src/main/res/raw
          ffmpeg -y -f lavfi -i color=c=white:s=320x240:r=1 -frames:v 1 \
            -c:v libx264 -profile:v baseline -level 3.0 -pix_fmt yuv420p \
            -movflags +faststart app/src/main/res/raw/test.mp4

      - name: Replace app configuration for native diagnostic build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          if 'androidx.media3:media3-exoplayer' not in s:
              s = s.replace('\n}', '\n\ndependencies {\n    implementation("androidx.media3:media3-exoplayer:1.5.1")\n}\n', 1)
          s = s.replace('versionCode = 1', 'versionCode = 2')
          s = s.replace('versionName = "1.0"', 'versionName = "2.0-native-player"')
          p.write_text(s)
          
          main = Path('app/src/main/java/com/dyslexia2813/teliktvwebview/MainActivity.kt')
          main.write_text(r'''package com.dyslexia2813.teliktvwebview

import android.app.Activity
import android.graphics.Color
import android.net.Uri
import android.os.Bundle
import android.view.SurfaceView
import android.view.View
import android.view.WindowManager
import android.widget.FrameLayout
import android.widget.TextView
import androidx.media3.common.Format
import androidx.media3.common.MediaItem
import androidx.media3.common.PlaybackException
import androidx.media3.common.Player
import androidx.media3.exoplayer.ExoPlayer
import androidx.media3.exoplayer.analytics.AnalyticsListener
import java.util.Locale

class MainActivity : Activity() {
    private lateinit var player: ExoPlayer
    private lateinit var status: TextView
    private var decoderName = "unknown"
    private var videoFormat = "unknown"
    private var framesDecoded = 0

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
        hideSystemUi()

        val root = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) }
        val surface = SurfaceView(this)
        root.addView(surface, FrameLayout.LayoutParams(-1, -1))

        status = TextView(this).apply {
            setTextColor(Color.WHITE)
            setBackgroundColor(0xCC000000.toInt())
            textSize = 16f
            setPadding(18, 18, 18, 18)
            text = "NATIVE PLAYER TEST\\nStarting..."
        }
        val statusLp = FrameLayout.LayoutParams(-2, -2)
        statusLp.leftMargin = 20
        statusLp.topMargin = 20
        root.addView(status, statusLp)
        setContentView(root)

        val mediaUri = Uri.parse("android.resource://$packageName/${R.raw.test}")
        player = ExoPlayer.Builder(this).build()
        player.setVideoSurfaceView(surface)
        player.addListener(object : Player.Listener {
            override fun onPlaybackStateChanged(state: Int) {
                updateStatus("state=" + when (state) {
                    Player.STATE_IDLE -> "IDLE"
                    Player.STATE_BUFFERING -> "BUFFERING"
                    Player.STATE_READY -> "READY"
                    Player.STATE_ENDED -> "ENDED"
                    else -> "?"
                })
            }

            override fun onIsPlayingChanged(isPlaying: Boolean) {
                updateStatus("isPlaying=$isPlaying")
            }

            override fun onPlayerError(error: PlaybackException) {
                updateStatus("PLAYER ERROR\\n${error.errorCodeName}\\n${error.message}")
            }
        })
        player.addAnalyticsListener(object : AnalyticsListener {
            override fun onVideoDecoderInitialized(
                eventTime: AnalyticsListener.EventTime,
                decoderName: String,
                initializedTimestampMs: Long,
                initializationDurationMs: Long
            ) {
                this@MainActivity.decoderName = decoderName
                updateStatus("decoder initialized")
            }

            override fun onVideoInputFormatChanged(
                eventTime: AnalyticsListener.EventTime,
                format: Format,
                decoderReuseEvaluation: androidx.media3.exoplayer.DecoderReuseEvaluation?
            ) {
                videoFormat = String.format(Locale.US, "%dx%d %s", format.width, format.height, format.sampleMimeType)
                updateStatus("video format changed")
            }

            override fun onVideoDecoderReleased(
                eventTime: AnalyticsListener.EventTime,
                decoderName: String
            ) {
                framesDecoded = 0
            }
        })

        updateStatus("creating ExoPlayer")
        player.setMediaItem(MediaItem.fromUri(mediaUri))
        player.prepare()
        player.playWhenReady = true
    }

    private fun updateStatus(event: String) {
        if (!::status.isInitialized || !::player.isInitialized) return
        runOnUiThread {
            status.text = "NATIVE PLAYER TEST\\n" +
                "event: $event\\n" +
                "playbackState: ${player.playbackState}\\n" +
                "isPlaying: ${player.isPlaying}\\n" +
                "decoder: $decoderName\\n" +
                "video: $videoFormat\\n" +
                "position: ${String.format(Locale.US, "%.2f", player.currentPosition / 1000.0)} s"
        }
    }

    private fun hideSystemUi() {
        window.decorView.systemUiVisibility =
            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
            View.SYSTEM_UI_FLAG_FULLSCREEN or
            View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
            View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
            View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
            View.SYSTEM_UI_FLAG_LAYOUT_STABLE
    }

    override fun onWindowFocusChanged(hasFocus: Boolean) {
        super.onWindowFocusChanged(hasFocus)
        if (hasFocus) hideSystemUi()
    }

    override fun onDestroy() {
        if (::player.isInitialized) player.release()
        super.onDestroy()
    }
}
''')
          PY

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telik-native-player-v2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
