name: Build Native Player Diagnostic V2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-native-player-v2.yml'
      - 'app/src/main/java/com/dyslexia2813/teliktvwebview/MainActivity.kt'
      - 'app/build.gradle.kts'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate known-good local H.264 MP4
        run: |
          mkdir -p app/src/main/res/raw
          ffmpeg -y -f lavfi -i color=c=white:s=320x240:r=1 -frames:v 1 \
            -c:v libx264 -profile:v baseline -level 3.0 -pix_fmt yuv420p \
            -movflags +faststart app/src/main/res/raw/test.mp4

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telik-native-player-v2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
